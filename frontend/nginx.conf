# Rendered from this template by nginx's envsubst at startup. Only ${PORT} and
# ${BACKEND_URL} are substituted (see NGINX_ENVSUBST_FILTER in the Dockerfile),
# so nginx's own $host/$uri/etc. survive.
server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback (works with Vue Router history mode too)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # proxy API calls to the backend
    location /api/ {
        proxy_pass ${BACKEND_URL}/;
        proxy_ssl_server_name on;            # needed when BACKEND_URL is https
        # Host must stay the upstream's hostname ($proxy_host, nginx default) so
        # Railway's edge routes by Host to the backend service — overriding it
        # with $host loops the request back to this frontend.
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
